fidelity:
  divergences: The conclusion is expressed as proper colorability from arbitrary finite vertex lists of size at least the floor of the bound. The palette type is arbitrary. The regular refinement follows the energy increment proof, including diagonal pairs. The groups of neighbors are packed in a fixed order. Rooted components are counted as subsets of the neighborhood of radius r−1.
