version: v0.4
project:
  name: A proof of Vu’s conjecture
  description: For every fixed ζ, ε > 0, a finite simple graph of sufficiently large degree bound Δ and maximum pair codegree at most ζΔ has list chromatic number at most (ζ + ε)Δ. The degree threshold is uniform in the number of vertices and in the lists.
  authors: [Abhishek Methuku]
  responsible_maintainers: [Abhishek Methuku]
  license: Apache-2.0
classification:
  arxiv: [math.CO]
  msc2020: [05C15]
sources:
  - title: A proof of Vu's conjecture
    authors: [Abhishek Methuku]
    type: paper
    location: Theorem 1.1, with the proof in Sections 3 through 7
    id: "urn:sha256:da3e9ecaa6fea8f9d7ba3cd64dd68cfc49e72e39ccc6b1f9eed7373a9633d968"
    relationship: formalizes
    author_endorsement: participated
    note: The author supplied this unpublished revision and directed the formalization. The paper is identified by its file digest. The code license applies to the repository.
  - title: A General Upper Bound on the List Chromatic Number of Locally Sparse Graphs
    authors: [Van H. Vu]
    type: paper
    id: https://doi.org/10.1017/S0963548301004898
    location: Section 3, Open Question 1
    relationship: background
  - title: 'A special case of Vu’s conjecture: colouring nearly disjoint graphs of bounded maximum degree'
    authors: [Tom Kelly, Daniela Kühn, Deryk Osthus]
    type: paper
    id: https://arxiv.org/abs/2109.11438
    relationship: background
